name: Network-free safety tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            architecture: x86_64
          - os: ubuntu-24.04
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          ACTUAL_ARCHITECTURE="$(uname -m)"
          printf 'RUNNER_OS=%s\n' '${{ matrix.os }}'
          printf 'EXPECTED_ARCHITECTURE=%s\n' "$EXPECTED_ARCHITECTURE"
          printf 'ACTUAL_ARCHITECTURE=%s\n' "$ACTUAL_ARCHITECTURE"
          test "$ACTUAL_ARCHITECTURE" = "$EXPECTED_ARCHITECTURE"

      - name: Install pinned uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install --disable-pip-version-check uv==0.12.5
          echo "$RUNNER_TEMP/uv-venv/bin" >>"$GITHUB_PATH"

      - name: Prepare Python 3.12 and pinned verifier dependency
        run: |
          uv python install 3.12
          uv run \
            --python 3.12 \
            --with 'cryptography==50.0.1' \
            python -c 'import cryptography; assert cryptography.__version__ == "50.0.1"'

      - name: Run network-free checks
        env:
          UV_OFFLINE: "1"
        run: ./tests/run-all.sh
