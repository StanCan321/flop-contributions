name: Network-free safety tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install --disable-pip-version-check uv==0.12.5
          echo "$RUNNER_TEMP/uv-venv/bin" >>"$GITHUB_PATH"

      - name: Prime pinned verifier dependency
        run: |
          uv run \
            --with 'cryptography==50.0.1' \
            python -c 'import cryptography; assert cryptography.__version__ == "50.0.1"'

      - name: Run network-free checks
        env:
          UV_OFFLINE: "1"
        run: ./tests/run-all.sh
