name: Network-free safety tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: network-free-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            architecture: x86_64
          - os: ubuntu-24.04
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          ACTUAL_ARCHITECTURE="$(uname -m)"
          printf 'RUNNER_OS=%s\n' '${{ matrix.os }}'
          printf 'EXPECTED_ARCHITECTURE=%s\n' "$EXPECTED_ARCHITECTURE"
          printf 'ACTUAL_ARCHITECTURE=%s\n' "$ACTUAL_ARCHITECTURE"
          test "$ACTUAL_ARCHITECTURE" = "$EXPECTED_ARCHITECTURE"

      - name: Install pinned uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install \
            --disable-pip-version-check \
            --require-hashes \
            -r requirements/uv.txt
          echo "$RUNNER_TEMP/uv-venv/bin" >>"$GITHUB_PATH"

      - name: Prepare Python 3.12 and pinned verifier dependency
        run: |
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/verifier-venv"
          uv pip install \
            --python "$RUNNER_TEMP/verifier-venv/bin/python" \
            --require-hashes \
            -r requirements/verifier.txt
          "$RUNNER_TEMP/verifier-venv/bin/python" -c \
            'import cryptography; assert cryptography.__version__ == "50.0.1"'

      - name: Run network-free checks
        env:
          UV_OFFLINE: "1"
        run: ./tests/run-all.sh
